[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "knesset-forecast"
version = "0.1.0"
description = "Bayesian multiparty election prediction and exact-parliament probability estimation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "tzdata==2025.2"]

[dependency-groups]
dev = ["pytest==8.4.1"]

[project.scripts]
knesset = "knesset_forecast.prediction:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knesset_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
